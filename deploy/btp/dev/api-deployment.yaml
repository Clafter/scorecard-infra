# Scorecard results API — Deployment. See design.md KA1–KA4, KA8.
#
# Image pinned to an immutable sha-<commit> tag (KA1): a redeploy is
# reproducible, and an unrelated merge republishing :main cannot change
# what runs here. Bump by editing the tag and re-applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorecard-api
  namespace: scorecard-infra-dev
  labels:
    app.kubernetes.io/name: scorecard-api
    app.kubernetes.io/part-of: scorecard-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scorecard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scorecard-api
        app.kubernetes.io/part-of: scorecard-infra
    spec:
      containers:
        - name: scorecard-api
          image: ghcr.io/clafter/scorecard-api:sha-92d24d8bc9c683e0d8b8b35fd3350104420f11b2
          ports:
            - name: http
              containerPort: 8080
          env:
            # Consolidated on the ONE cron-results bucket (deploy-kyma-cron
            # KC7 + controller-metadata-before-publish). Object Store gives
            # one hard-scoped credential per bucket, so API and cron worker
            # must share a single bucket+credential to exchange results:
            # the worker writes api-results/host/org/repo/results.json and
            # the API reads the same bucket+prefix with the same credential.
            # A separate api-results bucket would 403 the cross-read.
            - name: RESULTS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: scorecard-cron-results-binding
                  key: bucket
            - name: RESULTS_BUCKET_REGION
              valueFrom:
                secretKeyRef:
                  name: scorecard-cron-results-binding
                  key: region
            # Both the publish (POST) and read (GET) paths use the same
            # bucket+prefix; the GET fallback points there too so a single
            # credential serves every result.
            - name: SCORECARD_RESULTS_BUCKET_URL
              value: "s3://$(RESULTS_BUCKET)?region=$(RESULTS_BUCKET_REGION)&awssdk=v2&prefix=api-results/"
            - name: SCORECARD_CRON_RESULTS_BUCKET_URL
              value: "s3://$(RESULTS_BUCKET)?region=$(RESULTS_BUCKET_REGION)&awssdk=v2&prefix=api-results/"
            # --- AWS credentials: the cron-results bucket's own keypair ---
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: scorecard-cron-results-binding
                  key: access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: scorecard-cron-results-binding
                  key: secret_access_key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
