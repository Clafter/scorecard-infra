# In-cluster NATS broker for the batch queue. See add-nats-pubsub-driver
# and deploy-kyma-cron KC1.
#
# "Everything on BTP" (golden rule 1): the queue is a pod in the Kyma
# cluster, not AWS SQS and not SAP Event Mesh (which would need an
# entitlement + a from-scratch AMQP-1.0-over-WebSocket driver — golden
# rules 2 and 3). NATS core, single replica, no persistence: minimal for
# a dev evaluation (golden rule 2). At-most-once delivery is the accepted
# trade-off (add-nats-pubsub-driver KN2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorecard-nats
  namespace: scorecard-infra-dev
  labels:
    app.kubernetes.io/name: scorecard-nats
    app.kubernetes.io/part-of: scorecard-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scorecard-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scorecard-nats
        app.kubernetes.io/part-of: scorecard-infra
      annotations:
        # Keep NATS OUT of the Istio mesh. NATS speaks first on connect,
        # which deadlocks against sidecar mTLS interception (clients hit an
        # i/o timeout dialing 4222). The broker carries only internal queue
        # traffic and needs no mTLS; the paired DestinationRule
        # (cron-nats-istio.yaml) tells mesh clients to dial it in plaintext.
        # Minimal and robust vs. fighting native-sidecar iptables excludes
        # (golden rule 2).
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["--jetstream=false", "--http_port=8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: scorecard-nats
  namespace: scorecard-infra-dev
  labels:
    app.kubernetes.io/name: scorecard-nats
    app.kubernetes.io/part-of: scorecard-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scorecard-nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
