# Namespace for the scorecard-infra BTP dev deployment.
#
# istio-injection=enabled opts this namespace into Kyma's Istio mesh so
# APIRule (added in deploy-kyma-api) can route traffic to pods here.
#
# No NetworkPolicy here — see design.md K7. The egress surface is only
# knowable once the first workload is in; deploy-kyma-api owns the
# policy.
apiVersion: v1
kind: Namespace
metadata:
  name: scorecard-infra-dev
  labels:
    app.kubernetes.io/part-of: scorecard-infra
    environment: dev
    istio-injection: enabled
---
# Quota sized for the live dev workloads with real numbers (2026-10-29):
# API + NATS + cron worker + the weekly controller CronJob, each with an
# Istio sidecar (~1 CPU / ~1Gi limits per sidecar — the dominant term).
# Raised from the initial 4 CPU / 8Gi once the sidecar overhead was
# measured against three Istio-injected workloads (golden rule 2: fit the
# real need, not a guess).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: scorecard-infra-dev-quota
  namespace: scorecard-infra-dev
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
